<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Joseo - Boletería / Puerta</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060608;
      --card: #0e0e14;
      --gold: #ff7700;
      --green: #10b981;
      --red: #e11d48;
      --blue: #3b82f6;
      --text: #f8fafc;
      --muted: #94a3b8;
      --line: rgba(255, 255, 255, 0.08);
      --grey-line: rgba(255, 255, 255, 0.14);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .top-bar {
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(13, 13, 18, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .brand { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 2px; }
    .brand span { color: var(--gold); }
    .badge {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--green);
      color: var(--green);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .btn-logout {
      background: transparent;
      border: 1px solid var(--grey-line);
      color: #fff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-logout:hover { background: rgba(255, 255, 255, 0.08); }

    .main-wrap {
      max-width: 520px;
      margin: 14px auto 50px;
      padding: 0 14px;
    }

    /* Buscador */
    .search-box {
      margin-bottom: 12px;
      display: flex;
      gap: 10px;
    }
    .search-box input {
      flex: 1;
      background: #0d0d14;
      border: 1px solid var(--grey-line);
      border-radius: 10px;
      padding: 12px 16px;
      color: #fff;
      font-size: 14.5px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus {
      border-color: var(--gold);
    }

    /* Resultados rápidos de búsqueda */
    .quick-results {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }
    .quick-card {
      background: #13131c;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .quick-card:hover {
      background: #1b1b26;
      border-color: var(--gold);
    }

    /* Leyenda */
    .legend {
      display: flex;
      justify-content: center;
      gap: 14px;
      font-size: 11.5px;
      color: var(--muted);
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .dot.free { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .dot.pending { background: var(--gold); box-shadow: 0 0 6px var(--gold); }
    .dot.approved { background: var(--red); box-shadow: 0 0 6px var(--red); }
    .dot.ingresada { background: var(--blue); box-shadow: 0 0 6px var(--blue); }

    /* Plano Mesas Container */
    .map-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 900 / 1600;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: #09090c;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8);
      user-select: none;
    }
    .map-bg-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      pointer-events: none;
    }
    #mapImg {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    /* Logo overlay */
    .map-frame .terrace-logo-overlay {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 1.5%;
      width: 78% !important;
      height: 21% !important;
      max-width: 78%;
      max-height: 21%;
      z-index: 5;
      display: none;
      object-fit: contain;
      object-position: bottom center;
      pointer-events: none;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.85));
    }

    /* Fecha badge */
    .terrace-date-badge {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 70.3%;
      width: auto;
      min-width: 38%;
      max-width: 70%;
      height: 5.8%;
      z-index: 5;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      border-radius: 8px;
      border: 1.5px solid rgba(255, 119, 0, 0.6);
      background: rgba(8, 8, 12, 0.92);
      color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(14px, 3.2vw, 22px);
      letter-spacing: 2px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.85);
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
    }

    /* Botones de Mesas */
    .table-btn {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 5.8%;
      height: 3.26%;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.75);
      background: linear-gradient(145deg, #66f5bf, #16b878 55%, #08734b);
      color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(10px, 2.2vw, 13px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      z-index: 10;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .table-btn:hover {
      transform: translate(-50%, -50%) scale(1.15);
      z-index: 25;
    }
    .table-btn:active {
      transform: translate(-50%, -50%) scale(0.95);
    }
    .table-btn.pending {
      background: linear-gradient(145deg, #ffa858, #d45900 55%, #662600);
      border-color: #ff7700;
      box-shadow: 0 0 8px rgba(255, 119, 0, 0.5);
    }
    .table-btn.approved {
      background: linear-gradient(145deg, #ff5b66, #d20e21 55%, #70000a);
      border-color: #ff2d3d;
      box-shadow: 0 0 8px rgba(225, 29, 72, 0.5);
    }
    .table-btn.ingresada {
      background: linear-gradient(145deg, #58a6ff, #0a56ad 55%, #002e61);
      border-color: #3b82f6;
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.5);
    }
    .table-btn.highlight {
      animation: pulseGlow 0.8s infinite alternate ease-in-out;
      z-index: 30;
      border: 2px solid #fff;
    }
    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(1.15); box-shadow: 0 0 12px #ff7700; }
      100% { transform: translate(-50%, -50%) scale(1.45); box-shadow: 0 0 25px #ff7700, 0 0 35px #ff7700; }
    }

    /* Modal de Cobro */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--grey-line);
      border-radius: 18px;
      padding: 24px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }
    .saldo-box {
      background: rgba(255, 119, 0, 0.12);
      border: 1px solid var(--gold);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin: 16px 0;
    }
    .saldo-label { font-size: 12px; color: var(--gold); text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
    .saldo-val { font-family: 'Bebas Neue', sans-serif; font-size: 38px; color: #fff; letter-spacing: 1px; }

    .voucher-box {
      background: rgba(16, 185, 129, 0.1);
      border: 1px dashed #10b981;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 13px;
    }
    .voucher-title { font-weight: 700; color: #10b981; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }

    .btn-pay {
      padding: 14px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      border: none;
      width: 100%;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-cash { background: #10b981; color: #000; }
    .btn-transf { background: #3b82f6; color: #fff; }
    .btn-cancel { background: rgba(255, 255, 255, 0.1); color: #fff; margin-top: 6px; }

    /* Login */
    .login-wrap { max-width: 360px; margin: 15vh auto; padding: 24px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
    .login-wrap h1 { margin: 0 0 16px; font-size: 22px; text-align: center; font-family: 'Bebas Neue', sans-serif; letter-spacing: 2px; }
    .login-wrap h1 span { color: var(--gold); }
    .login-wrap input { width: 100%; background: #060608; border: 1px solid var(--grey-line); border-radius: 8px; padding: 12px; color: #fff; margin-bottom: 12px; box-sizing: border-box; }
    .login-wrap button { width: 100%; padding: 12px; background: var(--gold); color: #fff; font-weight: 800; border: none; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Vista Login -->
  <div id="loginView" class="login-wrap">
    <h1>JOSEO <span>BOLETERÍA</span></h1>
    <input type="email" id="loginEmail" placeholder="boletero@joseo.com">
    <input type="password" id="loginPassword" placeholder="••••••••">
    <button type="button" id="btnLogin">Ingresar a Boletería</button>
    <div id="loginError" style="color:#ff5555; font-size:12px; margin-top:12px; text-align:center;"></div>
  </div>

  <!-- Vista Boletería -->
  <div id="bolApp" style="display: none;">
    <header class="top-bar">
      <div class="brand">JOSEO <span>PUERTA</span> <span class="badge">TERRAZA</span></div>
      <button type="button" class="btn-logout" id="btnLogout">Salir</button>
    </header>

    <main class="main-wrap">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Buscar por número de mesa o nombre de cliente...">
      </div>

      <div id="quickResults" class="quick-results" style="display: none;"></div>

      <div class="legend">
        <span class="legend-item"><span class="dot free"></span>Libre</span>
        <span class="legend-item"><span class="dot pending"></span>Señada</span>
        <span class="legend-item"><span class="dot approved"></span>Vendida</span>
        <span class="legend-item"><span class="dot ingresada"></span>Dentro</span>
      </div>

      <!-- Mapa Interactivo de la Terraza -->
      <div class="map-frame" id="plano-mesas">
        <div id="mapBgLayer" class="map-bg-layer"></div>
        <img id="terraceLogoOverlay" class="terrace-logo-overlay" alt="Logo Joseo Terrace">
        <div id="terraceDateBadge" class="terrace-date-badge" aria-label="Fecha del evento"></div>
        <img id="mapImg" src="terraza_joseo.png" alt="Plano Terraza Joseo">
        <!-- Los botones de las mesas se inyectan acá sobre el mapa -->
      </div>
    </main>
  </div>

  <!-- Modal de Cobro / Puerta -->
  <div class="modal-overlay" id="cobroModal">
    <div class="modal-box">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px;">
        <h2 id="modalMesaTitle" style="margin: 0; font-size: 24px; font-family: 'Bebas Neue', sans-serif; letter-spacing: 1.5px;">MESA --</h2>
        <span id="modalStatusBadge" style="font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 6px;">ESTADO</span>
      </div>
      <p id="modalTitular" style="margin: 0 0 14px; font-size: 13px; color: var(--muted);">Cliente: --</p>

      <div class="saldo-box">
        <div class="saldo-label">Saldo a cobrar en puerta</div>
        <div class="saldo-val" id="saldoMontoDisplay">$0</div>
        <div id="senaPreviaText" style="font-size: 12px; color: var(--muted); margin-top: 4px;">Seña previa: $0</div>
      </div>

      <div class="voucher-box" id="voucherBox">
        <div class="voucher-title">🍹 Consumo y Beneficios a Entregar:</div>
        <div id="consumoBeneficioBox" style="background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 10px; margin-bottom: 8px;">
          <div id="consumoBadge" style="display:inline-block; font-size:11px; font-weight:800; padding:2px 8px; border-radius:4px; margin-bottom:4px;">HORARIO</div>
          <div id="consumoMontoCalculado" style="font-size:16px; font-weight:800; color:#10b981;">$0 en consumo</div>
          <div id="consumoDetalleRegla" style="font-size:11.5px; color:var(--muted); margin-top:2px;"></div>
        </div>
        <div id="voucherContent" style="color: #fff; font-weight: 600; font-size:13px;">--</div>
      </div>

      <div id="modalNotaBox" style="font-size: 12px; color: var(--muted); margin-bottom: 14px; display: none;">
        <strong>Nota:</strong> <span id="modalNotaText"></span>
      </div>

      <div id="cobroActions">
        <button type="button" class="btn-pay btn-cash" id="btnCobroEfectivo">
          💵 Cobrar Saldo en Efectivo (Marcar Ingreso)
        </button>
        <button type="button" class="btn-pay btn-transf" id="btnCobroTransferencia">
          💳 Cobrar Saldo con Transferencia (Marcar Ingreso)
        </button>
        <button type="button" class="btn-pay btn-cash" id="btnMarcarIngresadaDirecta" style="background: var(--blue); color:#fff; display:none;">
          ✅ Marcar Ingreso Directo (Saldo $0)
        </button>
      </div>

      <div id="yaIngresadaNotice" style="display:none; text-align:center; padding: 12px; background: rgba(59, 130, 246, 0.15); border: 1px solid var(--blue); border-radius: 8px; font-size: 13px; color: #93c5fd; margin-bottom: 8px;">
        ℹ️ Esta mesa ya ingresó al evento.
      </div>

      <button type="button" class="btn-pay btn-cancel" id="btnCancelCobro">Cerrar</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {apiKey:"AIzaSyC44gcXFwvIlPLI3RGJq1iHW6S2cMgcfvY",authDomain:"mesas-cubano-bar.firebaseapp.com",projectId:"mesas-cubano-bar",storageBucket:"mesas-cubano-bar.firebasestorage.app",messagingSenderId:"1072135346765",appId:"1:1072135346765:web:e8a6ee5497366a8b1f5a04"};
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
      db.useEmulator("localhost", 8085);
      auth.useEmulator("http://localhost:9099");
    }

    const loginView = document.getElementById("loginView");
    const bolApp = document.getElementById("bolApp");
    const loginEmail = document.getElementById("loginEmail");
    const loginPassword = document.getElementById("loginPassword");
    const btnLogin = document.getElementById("btnLogin");
    const loginError = document.getElementById("loginError");
    const btnLogout = document.getElementById("btnLogout");

    const planoMesas = document.getElementById("plano-mesas");
    const mapBgLayer = document.getElementById("mapBgLayer");
    const terraceLogoOverlay = document.getElementById("terraceLogoOverlay");
    const terraceDateBadge = document.getElementById("terraceDateBadge");
    const searchInput = document.getElementById("searchInput");
    const quickResults = document.getElementById("quickResults");

    // Coordenadas exactas de mesas en Terraza (terraza.png)
    const TABLES_TERRAZA = [
      { id:"T-3",  num:"3",  x:11.1, y:36.3 },
      { id:"T-4",  num:"4",  x:19.2, y:34.6 },
      { id:"T-5",  num:"5",  x:26.4, y:34.6 },
      { id:"T-6",  num:"6",  x:49.3, y:36.9 },
      { id:"T-7",  num:"7",  x:37.1, y:41.9 },
      { id:"T-A",  num:"A",  x:24.0, y:46.1 },
      { id:"T-B",  num:"B",  x:36.8, y:46.1 },
      { id:"T-C",  num:"C",  x:49.3, y:46.1 },
      { id:"T-D",  num:"D",  x:36.8, y:52.6 },
      { id:"T-E",  num:"E",  x:49.3, y:52.6 },
      { id:"T-2",  num:"2",  x:11.1, y:43.7 },
      { id:"T-1",  num:"1",  x:11.1, y:50.9 },
      { id:"T-8",  num:"8",  x:18.6, y:52.8 },
      { id:"T-16", num:"16", x:72.3, y:34.2 },
      { id:"T-17", num:"17", x:77.6, y:40.9 },
      { id:"T-18", num:"18", x:77.4, y:45.9 },
      { id:"T-19", num:"19", x:77.6, y:50.9 },
      { id:"T-15", num:"15", x:89.9, y:41.3 },
      { id:"T-9",  num:"9",  x:30.1, y:64.8 },
      { id:"T-10", num:"10", x:39.0, y:64.8 },
      { id:"T-11", num:"11", x:48.0, y:64.9 },
      { id:"T-12", num:"12", x:57.0, y:64.8 },
      { id:"T-13", num:"13", x:80.8, y:64.8 },
      { id:"T-14", num:"14", x:88.4, y:64.8 }
    ];

    let reservasData = {};
    let configJoseo = {};
    let activeMesaId = null;

    btnLogin.addEventListener("click", async () => {
      const email = loginEmail.value.trim();
      const pass = loginPassword.value;
      loginError.textContent = "";
      btnLogin.disabled = true;
      try {
        await auth.signInWithEmailAndPassword(email, pass);
      } catch (err) {
        loginError.textContent = "Error: " + err.message;
        btnLogin.disabled = false;
      }
    });

    btnLogout.addEventListener("click", () => auth.signOut());

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        try {
          const userDoc = await db.collection("users").doc(user.email.toLowerCase()).get();
          if (!userDoc.exists) throw new Error("Usuario sin rol.");
          const role = userDoc.data().role;

          if (role !== "boleteria_joseo" && role !== "admin_joseo" && role !== "admin") {
            throw new Error("No tienes permisos de boletería para Joseo.");
          }

          loginView.style.display = "none";
          bolApp.style.display = "block";
          iniciarEscuchas();
        } catch (err) {
          loginError.textContent = err.message;
          setTimeout(() => auth.signOut(), 2500);
        }
      } else {
        loginView.style.display = "block";
        bolApp.style.display = "none";
        btnLogin.disabled = false;
      }
    });

    function iniciarEscuchas() {
      // 1. Escuchar diseño de Joseo (config/joseo)
      db.collection("config").doc("joseo").onSnapshot(doc => {
        if (!doc.exists) return;
        configJoseo = doc.data();
        const c = configJoseo;
        if (c.bgUrl) {
          mapBgLayer.style.backgroundImage = `url("${c.bgUrl}")`;
        } else {
          mapBgLayer.style.backgroundImage = "";
        }
        if (c.logoUrl) {
          terraceLogoOverlay.src = c.logoUrl;
          terraceLogoOverlay.style.display = "block";
        } else {
          terraceLogoOverlay.style.display = "none";
        }
        if (c.eventDate) {
          terraceDateBadge.textContent = c.eventDate;
          terraceDateBadge.style.display = "flex";
        } else {
          terraceDateBadge.style.display = "none";
        }
      });

      // 2. Escuchar reservas de Joseo (reservas_joseo)
      db.collection("reservas_joseo").onSnapshot(snapshot => {
        reservasData = {};
        snapshot.forEach(doc => {
          reservasData[doc.id] = doc.data();
        });
        renderMap();
      });
    }

    function renderMap() {
      // Eliminar botones viejos
      planoMesas.querySelectorAll(".table-btn").forEach(b => b.remove());
      const query = searchInput.value.trim().toLowerCase();
      quickResults.innerHTML = "";
      let matches = 0;

      TABLES_TERRAZA.forEach(table => {
        const r = reservasData[table.id] || {};
        const nombre = r.nombre || "";
        const status = r.status || "libre";
        const isIngresada = status === "ingresada";
        const isApproved = ["aprobada", "confirmada", "vendida", "ocupada"].includes(status);
        const isPending = ["disputa", "pendiente", "seña", "sena"].includes(status);

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "table-btn" + (isIngresada ? " ingresada" : isApproved ? " approved" : isPending ? " pending" : "");
        btn.style.left = table.x + "%";
        btn.style.top = table.y + "%";
        btn.textContent = table.num;
        btn.setAttribute("data-id", table.id);

        // Búsqueda
        let isMatch = false;
        if (query) {
          const matchNum = table.num.toLowerCase() === query || ("mesa " + table.num.toLowerCase()) === query;
          const matchNombre = nombre.toLowerCase().includes(query);
          if (matchNum || matchNombre) {
            isMatch = true;
            btn.classList.add("highlight");
            matches++;

            // Agregar a resultados rápidos
            const ex = r.excepcion || {};
            const saldo = ex.saldoEnPuerta !== undefined ? ex.saldoEnPuerta : (r.saldoPuerta || 0);
            const qRow = document.createElement("div");
            qRow.className = "quick-card";
            qRow.innerHTML = `
              <div>
                <strong style="color:var(--gold); font-family:'Bebas Neue',sans-serif; font-size:18px;">MESA ${table.num}</strong>
                <span style="color:#fff; font-size:13px; margin-left:8px;">${nombre || 'Sin nombre'}</span>
              </div>
              <div style="text-align:right;">
                <span style="font-size:12px; color:${saldo > 0 ? 'var(--gold)' : 'var(--green)'}; font-weight:700;">
                  ${isIngresada ? 'DENTRO' : (saldo > 0 ? 'Resta: $' + saldo.toLocaleString('es-AR') : 'PAGADA')}
                </span>
              </div>
            `;
            qRow.addEventListener("click", () => abrirCobroModal(table.id));
            quickResults.appendChild(qRow);
          }
        }

        btn.addEventListener("click", () => abrirCobroModal(table.id));
        planoMesas.appendChild(btn);
      });

      quickResults.style.display = (query && matches > 0) ? "flex" : "none";
    }

    searchInput.addEventListener("input", renderMap);

    // Modal de Cobro
    const cobroModal = document.getElementById("cobroModal");
    const modalMesaTitle = document.getElementById("modalMesaTitle");
    const modalStatusBadge = document.getElementById("modalStatusBadge");
    const modalTitular = document.getElementById("modalTitular");
    const saldoMontoDisplay = document.getElementById("saldoMontoDisplay");
    const senaPreviaText = document.getElementById("senaPreviaText");
    const voucherBox = document.getElementById("voucherBox");
    const voucherContent = document.getElementById("voucherContent");
    const modalNotaBox = document.getElementById("modalNotaBox");
    const modalNotaText = document.getElementById("modalNotaText");
    const cobroActions = document.getElementById("cobroActions");
    const btnCobroEfectivo = document.getElementById("btnCobroEfectivo");
    const btnCobroTransferencia = document.getElementById("btnCobroTransferencia");
    const btnMarcarIngresadaDirecta = document.getElementById("btnMarcarIngresadaDirecta");
    const yaIngresadaNotice = document.getElementById("yaIngresadaNotice");
    const btnCancelCobro = document.getElementById("btnCancelCobro");

    function abrirCobroModal(id) {
      activeMesaId = id;
      const num = id.replace("T-", "");
      const r = reservasData[id] || {};
      const ex = r.excepcion || {};
      const status = r.status || "libre";

      modalMesaTitle.textContent = "MESA " + num;
      modalTitular.textContent = "Cliente: " + (r.nombre || "Sin reserva asignada") + (r.contacto ? " — " + r.contacto : "");

      // Badge de estado
      modalStatusBadge.textContent = status.toUpperCase();
      if (status === "ingresada") {
        modalStatusBadge.style.background = "rgba(59, 130, 246, 0.2)";
        modalStatusBadge.style.color = "var(--blue)";
      } else if (["aprobada", "confirmada", "vendida", "ocupada"].includes(status)) {
        modalStatusBadge.style.background = "rgba(225, 29, 72, 0.2)";
        modalStatusBadge.style.color = "var(--red)";
      } else if (["pendiente", "disputa", "seña", "sena"].includes(status)) {
        modalStatusBadge.style.background = "rgba(255, 119, 0, 0.2)";
        modalStatusBadge.style.color = "var(--gold)";
      } else {
        modalStatusBadge.style.background = "rgba(16, 185, 129, 0.2)";
        modalStatusBadge.style.color = "var(--green)";
      }

      const saldo = ex.saldoEnPuerta !== undefined ? ex.saldoEnPuerta : (r.saldoPuerta !== undefined ? r.saldoPuerta : 0);
      const sena = ex.senaPactada !== undefined ? ex.senaPactada : (r.montoSenado || 0);

      saldoMontoDisplay.textContent = "$" + Number(saldo).toLocaleString("es-AR");
      senaPreviaText.textContent = "Seña previa: $" + Number(sena).toLocaleString("es-AR");

      // Cálculo dinámico de beneficio de consumo por horario
      const totalMesa = ex.valorPactado !== undefined ? ex.valorPactado : (r.valorTotal !== undefined ? r.valorTotal : (configJoseo.valorMesa || 300000));
      const limite = configJoseo.horarioLimite || "03:00";
      const pctAntes = configJoseo.porcentajeAntes !== undefined ? configJoseo.porcentajeAntes : 100;
      const pctDespues = configJoseo.porcentajeDespues !== undefined ? configJoseo.porcentajeDespues : 75;

      const now = new Date();
      const h = now.getHours();
      const m = now.getMinutes();
      const [limH, limM] = limite.split(":").map(Number);
      const horaStr = String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");

      // Regla horaria nocturna: antes de las 12hs se compara con el límite, de 12hs a 23hs es antes
      const esAntes = (h >= 12) || (h < limH) || (h === limH && m < limM);
      const pctAplicable = esAntes ? pctAntes : pctDespues;
      const montoConsumo = Math.round((totalMesa * pctAplicable) / 100);

      const consumoBadge = document.getElementById("consumoBadge");
      const consumoMontoCalculado = document.getElementById("consumoMontoCalculado");
      const consumoDetalleRegla = document.getElementById("consumoDetalleRegla");

      if (esAntes) {
        consumoBadge.textContent = "🟢 DENTRO DE HORARIO (" + horaStr + " hs — ANTES DE LAS " + limite + " AM)";
        consumoBadge.style.background = "rgba(16, 185, 129, 0.2)";
        consumoBadge.style.color = "var(--green)";
        consumoMontoCalculado.style.color = "var(--green)";
        consumoMontoCalculado.textContent = "$" + Number(montoConsumo).toLocaleString("es-AR") + " en consumo (" + pctAplicable + "% reintegro)";
        consumoDetalleRegla.textContent = "Aplica reintegro completo del " + pctAplicable + "% del valor total de la mesa ($" + Number(totalMesa).toLocaleString("es-AR") + ").";
      } else {
        consumoBadge.textContent = "🟡 FUERA DE HORARIO (" + horaStr + " hs — DESPUÉS DE LAS " + limite + " AM)";
        consumoBadge.style.background = "rgba(255, 119, 0, 0.2)";
        consumoBadge.style.color = "var(--gold)";
        consumoMontoCalculado.style.color = "var(--gold)";
        consumoMontoCalculado.textContent = "$" + Number(montoConsumo).toLocaleString("es-AR") + " en consumo (" + pctAplicable + "% reintegro)";
        consumoDetalleRegla.textContent = "Ingresó después de las " + limite + " AM. Aplica el " + pctAplicable + "% del valor total ($" + Number(totalMesa).toLocaleString("es-AR") + ").";
      }

      // Vouchers y notas adicionales
      const bebidas = ex.bebidas || (r.vouchersBebida ? (r.vouchersBebida + " vouchers de bebida") : "");
      const extraConfig = configJoseo.beneficiosExtra ? ("✨ " + configJoseo.beneficiosExtra) : "";
      const extras = [bebidas, extraConfig].filter(Boolean).join(" | ");
      if (extras) {
        voucherContent.textContent = extras;
      } else {
        voucherContent.textContent = "Sin beneficios extra adicionales.";
      }
      voucherBox.style.display = "block";

      // Nota
      const nota = ex.nota || r.nota || "";
      if (nota) {
        modalNotaText.textContent = nota;
        modalNotaBox.style.display = "block";
      } else {
        modalNotaBox.style.display = "none";
      }

      // Visibilidad de botones según estado y saldo
      if (status === "ingresada") {
        cobroActions.style.display = "none";
        yaIngresadaNotice.style.display = "block";
      } else {
        cobroActions.style.display = "block";
        yaIngresadaNotice.style.display = "none";

        if (saldo === 0) {
          btnCobroEfectivo.style.display = "none";
          btnCobroTransferencia.style.display = "none";
          btnMarcarIngresadaDirecta.style.display = "block";
        } else {
          btnCobroEfectivo.style.display = "block";
          btnCobroTransferencia.style.display = "block";
          btnMarcarIngresadaDirecta.style.display = "none";
        }
      }

      cobroModal.classList.add("open");
    }

    btnCancelCobro.addEventListener("click", () => {
      cobroModal.classList.remove("open");
      activeMesaId = null;
    });

    async function registrarCobro(medioPago) {
      if (!activeMesaId) return;
      const r = reservasData[activeMesaId] || {};
      const ex = r.excepcion || {};
      const saldo = ex.saldoEnPuerta !== undefined ? ex.saldoEnPuerta : (r.saldoPuerta !== undefined ? r.saldoPuerta : 0);

      btnCobroEfectivo.disabled = true;
      btnCobroTransferencia.disabled = true;
      btnMarcarIngresadaDirecta.disabled = true;

      try {
        // 1. Actualizar mesa en reservas_joseo
        await db.collection("reservas_joseo").doc(activeMesaId).set({
          status: "ingresada",
          saldoCobradoEnPuerta: saldo,
          medioPagoPuerta: medioPago,
          ingresadoAt: Date.now(),
          cobradoPor: auth.currentUser.email
        }, { merge: true });

        // 2. Registrar en caja_joseo si hubo cobro
        if (saldo > 0 && medioPago !== "sin_cobro") {
          await db.collection("caja_joseo").add({
            mesaId: activeMesaId,
            monto: saldo,
            medioPago: medioPago,
            tipo: "cobro_puerta",
            cliente: r.nombre || "Mesa " + activeMesaId,
            responsable: auth.currentUser.email,
            ts: Date.now()
          });
        }

        cobroModal.classList.remove("open");
        activeMesaId = null;
        alert("✅ Ingreso confirmado." + (saldo > 0 ? " Cobro de $" + Number(saldo).toLocaleString("es-AR") + " registrado." : ""));
      } catch (err) {
        alert("Error al registrar cobro: " + err.message);
      } finally {
        btnCobroEfectivo.disabled = false;
        btnCobroTransferencia.disabled = false;
        btnMarcarIngresadaDirecta.disabled = false;
      }
    }

    btnCobroEfectivo.addEventListener("click", () => registrarCobro("efectivo"));
    btnCobroTransferencia.addEventListener("click", () => registrarCobro("transferencia"));
    btnMarcarIngresadaDirecta.addEventListener("click", () => registrarCobro("sin_cobro"));
  </script>
</body>
</html>
